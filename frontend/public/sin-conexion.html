<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sin conexión · Gestión de Activos</title>
    <style>
      /* Suelta a propósito: esta página tiene que poder dibujarse cuando no
         hay red, así que no pide ni una hoja de estilos ni una tipografía. */
      :root {
        color-scheme: light dark;
        --azul: #0d6efd;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: #fff;
        color: #212529;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #121417;
          color: #dee2e6;
        }
      }
      main {
        max-width: 26rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        line-height: 1.5;
      }
      .apagado {
        opacity: 0.7;
        font-size: 0.9rem;
      }
      button {
        margin-top: 1rem;
        padding: 0.6rem 1.4rem;
        font: inherit;
        color: #fff;
        background: var(--azul);
        border: 0;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      svg {
        width: 4rem;
        height: 4rem;
        color: var(--azul);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path stroke-linecap="round" d="M2 2 L22 22" />
        <path stroke-linecap="round" d="M5 12.5a10 10 0 0 1 4-2.4M15 10.1a10 10 0 0 1 4 2.4" />
        <path stroke-linecap="round" d="M8.5 16a5 5 0 0 1 7 0" />
        <circle cx="12" cy="19.5" r="1" fill="currentColor" stroke="none" />
      </svg>
      <h1>No hay conexión</h1>
      <p>
        El teléfono no alcanza el servidor. Suele pasar dentro de una bodega o
        en un andén.
      </p>
      <p class="apagado">
        Lo que ya estaba abierto sigue en pantalla. Para consultar un equipo
        hace falta red: el inventario cambia durante el día y enseñarle el de
        ayer sería peor que no enseñarle nada.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      // Reintenta solo en cuanto el sistema avisa de que volvió la red, para no
      // dejar a alguien pulsando el botón en un pasillo.
      window.addEventListener("online", function () {
        location.reload();
      });
    </script>
  </body>
</html>
