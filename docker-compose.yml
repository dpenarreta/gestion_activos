# SQL Server para desarrollo local. El stack completo (backend + frontend)
# vive en docker-compose.prod.yml — uso explícito: `docker compose -f
# docker-compose.prod.yml up -d --build` (ver docs/DEPLOYMENT.md más abajo
# y el README).
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?la variable DB_PASSWORD es obligatoria}
      MSSQL_PID: Developer
    ports:
      # Atado a la interfaz local: sin el `127.0.0.1`, Docker publica el puerto
      # en **todas** las interfaces y el motor queda expuesto a la red de la
      # oficina y del wifi. Lo único que se conecta aquí es el backend de esta
      # misma máquina, y la contraseña de `sa` está en un `.env` de desarrollo:
      # dos cosas que no deberían quedar al alcance de un escaneo de puertos.
      - "127.0.0.1:${DB_PORT:-1433}:1433"
      #
      # Solo IPv4, y por eso el backend debe conectar a `127.0.0.1` y no a
      # `localhost`: en Windows, `localhost` resuelve primero a `::1`, y el
      # proxy de Docker acepta ahí la conexión pero no la entrega al
      # contenedor. El síntoma es «el equipo de destino denegó expresamente
      # dicha conexión» con el puerto escuchando —parece un fallo de la base y
      # es de resolución de nombres—. Publicar también `[::1]` no lo arregla:
      # la acepta igual y la sigue sin entregar.
    volumes:
      - mssql_data:/var/opt/mssql
      # El `.bak` lo escribe SQL Server en **su** sistema de archivos, no el
      # comando: sin este montaje queda dentro del contenedor, que es el mismo
      # sitio que la base y no protege del caso que importa —perder la máquina—.
      # Con él, el respaldo automático deja el archivo directamente en el disco
      # del host, junto al manifiesto y los adjuntos.
      - ./backend/respaldos/sql:/var/opt/mssql/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mssql_data:
